; ============================================================
;  智能安防门禁系统（传感器课程设计 第15组）
;  主控：ESP32-S3   框架：Arduino (PlatformIO)
; ------------------------------------------------------------
;  打开方式：VSCode 安装 PlatformIO 插件 → PIO Home → Open Project
;           选择本目录（含 platformio.ini 的这一层）
; ============================================================

[env:esp32-s3-devkitc-1]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; ---- 目录结构：include/ 公共头文件；src/hardware 硬件驱动；src/software 软件逻辑 ----
build_flags =
  -Iinclude
  -Isrc/hardware
  -Isrc/software

; ---- 库依赖（首次编译自动下载）----
lib_deps =
  adafruit/Adafruit SSD1306@^2.5.0
  adafruit/Adafruit GFX Library@^1.11.0

; ---- 注意事项 ----
; 1. 如果你的 S3 板子是厂家自绘板/其他型号，把 board 改成对应的，
;    不确定就用 esp32-s3-devkitc-1，ESP32-S3 Arduino 核心通用。
; 2. 如果你的板子是"原生 USB 串口"（插上电脑不出现 CH340/CP210x 端口，
;    而是一个通用 USB 设备），把上面 build_flags 换成下面 5 行（保留 -I 三项）。
; build_flags =
;   -DARDUINO_USB_CDC_ON_BOOT=1
;   -DARDUINO_USB_MSC_ON_BOOT=0
;   -DARDUINO_USB_DFU_ON_BOOT=0
;   -Iinclude
;   -Isrc/hardware
;   -Isrc/software
