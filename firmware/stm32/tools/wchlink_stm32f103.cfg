# ============================================================================
#  OpenOCD 配置：WCH-Link（SWD 两线）→ STM32F103C8T6
#
#  WCH-Link 在 SWD 模式下就是标准 CMSIS-DAP 调试器，OpenOCD 直接认。
#  接线： CLK → PA14(SWDCLK)， DIO → PA13(SWDIO)， GND → GND， 3V3 → 3V3
#
#  用法：
#    openocd -f tools/wchlink_stm32f103.cfg -c "program cmake-build-debug/out/xxx.hex verify reset exit"
# ============================================================================
source [find interface/cmsis-dap.cfg]
transport select swd

# WCH-Link 的 SWD 速度可以开快，1MHz 比较稳；如果报错改成 500
adapter speed 1000

# 目标芯片：STM32F103 中容量（C8T6 = 64KB Flash）
source [find target/stm32f1x.cfg]

# 复位方式：srst_only 需要 RST 脚；只接 SWD 两线时用 sysresetreq（软件复位）
reset_config srst_only srst_nogate connect_assert_srst
# 若没接 RST 线导致连不上，把上面一行换成：
# reset_config none
